<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S33 - Nostos One</title>
<meta name="description" content="Sintetizzatore modulare polifonico a lavagna, da suonare con una tastiera MIDI.">
<meta name="theme-color" content="#14161a">
<meta name="application-name" content="Nostos One">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nostos One">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f6f5f2;--fg:#1d1f23;--mut:#6b6f76;--line:#d5d3cc;--acc:#1f5fbf;--card:#ffffff;--zv:#00000000;--zm:#1f5fbf14;--cab:#4b5563;--f-src:#2f7d5b;--f-mod:#c0601f;--f-proc:#2c5fa8;--f-fx:#7a4aa3;--f-out:#505763;--cap1:#ffffff;--cap2:#c4c8d0;--rim1:#fbfbfc;--rim2:#8f95a0;--pt:#1d1f23}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--fg:#e8e8e6;--mut:#8e9299;--line:#32343a;--acc:#6aa2ff;--card:#23252a;--zm:#6aa2ff18;--cab:#9aa3b2;--f-src:#3f9a74;--f-mod:#d27a3a;--f-proc:#4f84d6;--f-fx:#9566c2;--f-out:#6b7380;--cap1:#5a606b;--cap2:#262930;--rim1:#737a86;--rim2:#101215;--pt:#f4f4f2}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 10px}
button,select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar .sp{flex:1}
#msg{color:var(--mut);min-height:20px;margin:6px 0}
svg{width:100%;max-width:1500px;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg);touch-action:none;user-select:none;display:block}
.mod rect.b{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.mod.sel rect.b{stroke:var(--acc);stroke-width:2.5;filter:drop-shadow(0 0 6px var(--acc))}
.mod text{fill:var(--fg);font-size:11px;pointer-events:none}
.mod text.h{font-size:12px;font-weight:600;fill:#fff}
.mod circle{fill:var(--card);stroke:var(--cab);stroke-width:1.6;cursor:crosshair}
.mod circle:hover{fill:var(--acc)}
.cab{fill:none;stroke:var(--cab);stroke-width:2.2}
.cab{stroke-width:3;stroke-linecap:round}
.cab.c-src{stroke:var(--f-src)}.cab.c-mod{stroke:var(--f-mod)}.cab.c-proc{stroke:var(--f-proc)}.cab.c-fx{stroke:var(--f-fx)}.cab.c-out{stroke:var(--f-out)}
.cabsh{fill:none;stroke:#000;opacity:.14;stroke-width:5;stroke-linecap:round}
.cab.sel{stroke:var(--acc);stroke-width:4}
.hd.f-src{fill:var(--f-src)}.hd.f-mod{fill:var(--f-mod)}.hd.f-proc{fill:var(--f-proc)}.hd.f-fx{fill:var(--f-fx)}.hd.f-out{fill:var(--f-out)}
.kns{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.kn{display:flex;flex-direction:column;align-items:center;width:78px;user-select:none}
.kn svg{touch-action:none;cursor:ns-resize;border:0;border-radius:0;background:none;max-width:none}
.kn .ks{fill:#000;opacity:.32;filter:blur(1.6px)}
.kn .kr{fill:url(#krim)}.kn .kc{fill:url(#kcap)}.kn .kd{fill:url(#kdish)}
.kn .l{font-size:11px;color:var(--mut)}.kn .v{font-size:12px;font-variant-numeric:tabular-nums}
.kn .tr{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.kn .va{fill:none;stroke-width:4;stroke-linecap:round}
.kn .pn{stroke:var(--pt);stroke-width:2.6;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.zl{fill:var(--mut);font-size:12px}
#insp{margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;max-width:1500px;min-height:56px}
.row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;margin:4px 0}
.row output{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
.k{color:var(--mut);margin-top:10px}
.hide{display:none!important}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 10px}
.tabs button{border:0;border-radius:999px;padding:5px 18px;font-weight:600}
.tabs button.on{background:var(--fg);color:var(--bg)}
.pn-mon{display:flex;align-items:stretch;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:14px;overflow:hidden}
.mon{flex:1 1 0;min-width:0}
.mon.pre{min-height:104px;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#0d0f12,#171b21);color:#e8e8e6;display:flex;flex-direction:column;gap:3px}
.ml{font-size:10px;letter-spacing:.16em;color:#8e9299}
.mn{font-size:20px;font-weight:700;line-height:1.15;color:var(--acc);text-shadow:0 0 14px color-mix(in srgb,var(--acc) 55%,transparent);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.md{font-size:11px;color:#8e9299;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.mc span{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid #2c3038;color:#b9bec7}
.mc span.mod{border-color:var(--acc);color:var(--acc)}
.spl{width:14px;flex:none;cursor:col-resize;position:relative;touch-action:none}
.spl::after{content:"";position:absolute;left:6px;top:20%;bottom:20%;width:2px;border-radius:2px;background:var(--line)}
.spl:hover::after{background:var(--acc)}
.pn-bar{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:12px;color:var(--mut)}
.pn-bar button{padding:3px 12px;border-radius:999px;font-size:12px}
.pn-bar button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#cards.tpl{display:flex;flex-wrap:wrap;gap:12px}
.tc{flex:1 1 auto}
.tc .kns{max-width:520px}
.brk{flex-basis:100%;height:0}
.arp .ch{align-items:center}
.arpk{align-items:flex-start;gap:14px}
#tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
#tools>.pn-card{flex:1 1 auto;margin:0!important}
.stk{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.arpk>.stk.b{margin-top:14px}
.stk .tgl{padding:6px 12px;white-space:nowrap}
.stk .kn.sl{width:112px}.stk .kn.sl select{width:100%;margin:0!important}
.arpk>.kn.vled{width:86px}.arpk>.kn.vled .octled{margin-top:11px}
#velLed.fl b{opacity:.25;transition:none}
.arpk>.kn.sl{width:100px}
.arpk>.kn.sl select{width:100%;margin:17px 0 0!important}
.tgl{border-radius:999px;padding:6px 16px;font-weight:700;letter-spacing:.08em;font-size:12px}
.tgl.on{background:var(--f-mod);border-color:var(--f-mod);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--f-mod) 60%,transparent)}
.led{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.led.on{background:var(--f-mod);box-shadow:0 0 8px var(--f-mod)}
.key.arpn{background:linear-gradient(var(--f-mod),color-mix(in srgb,var(--f-mod) 60%,#fff))}
.key.blk.arpn{background:linear-gradient(var(--f-mod),color-mix(in srgb,var(--f-mod) 50%,#000))}
.mon canvas{width:100%;height:104px;display:block;border-radius:12px;background:linear-gradient(180deg,#0d0f12,#171b21)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec{grid-column:1/-1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:10px 2px 0}
.pn-card{position:relative;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 8px 24px -16px rgba(0,0,0,.4);overflow:hidden}
.pn-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--fc)}
.pn-card .ch{display:flex;align-items:baseline;gap:8px}
.pn-card .ch b{font-size:13px;letter-spacing:.02em}
.pn-card .ch span{margin-left:auto;font-size:11px;color:var(--mut)}
.pn-card .sub{font-size:11px;color:var(--mut);min-height:16px;margin-top:2px}
.pn-card .kn{width:70px}
.pn-card .kn svg{width:64px;height:64px}
.pn-card .kn .tr,.pn-card .kn .va{stroke-width:5}
.pn-card .kn .va{filter:drop-shadow(0 0 4px currentColor)}
.pn-card .kn .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.pn-keys{position:sticky;bottom:0;display:flex;gap:16px;align-items:flex-end;padding:12px 14px;margin-top:16px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);overflow-x:auto}
#kbd{position:relative;height:120px;flex:none}
.key{position:absolute;top:0;width:36px;height:120px;background:linear-gradient(#fff,#e7e8ee);border:1px solid #c4c8d0;border-radius:0 0 8px 8px;touch-action:none;cursor:pointer}
.key.blk{width:22px;height:74px;z-index:2;background:linear-gradient(#2b2e35,#0c0e11);border-color:#000;border-radius:0 0 6px 6px}
.key.on{background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 60%,#fff))}
.key.blk.on{background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 50%,#000))}
.wh{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.wheel{position:relative;width:42px;height:120px;border-radius:12px;background:repeating-linear-gradient(0deg,#2b2e35 0 3px,#1a1c21 3px 6px);border:1px solid #000;touch-action:none;cursor:ns-resize}
.wheel i{position:absolute;left:3px;right:3px;height:26px;border-radius:8px;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 50%,#000));box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.wlab{font-size:10px;color:var(--mut);letter-spacing:.1em}
.oct{display:flex;flex-direction:column;gap:6px;flex:none;align-items:stretch}
.octled{height:42px;border-radius:8px;background:linear-gradient(180deg,#07090b,#14181d);border:1px solid #000;box-shadow:inset 0 1px 6px #000,0 1px 0 #ffffff22;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace}
.octled b{font-size:19px;line-height:1;color:var(--acc);text-shadow:0 0 10px var(--acc);font-variant-numeric:tabular-nums;transition:opacity .25s}
.octled span{font-size:9px;letter-spacing:.1em;color:#7d8590;margin-top:2px}
.octled.fl b{opacity:.25;transition:none}
*{-webkit-tap-highlight-color:transparent}
.db{position:relative;width:34px;height:110px;margin:6px 0;border-radius:10px;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:ns-resize;background:repeating-linear-gradient(to top,transparent 0 11.4px,rgba(255,255,255,.07) 11.4px 12.4px),linear-gradient(#0d0f12,#171b21);-webkit-user-select:none;user-select:none}
.dbf{position:absolute;left:0;right:0;bottom:0;background:var(--c);opacity:.85}
.dbt{position:absolute;left:0;right:0;height:4px;background:#fff;box-shadow:0 0 8px var(--c)}
#panelView,#boardView,.tabs,.pn-bar,.bar button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.key,.wheel,.kn svg,.spl,#mon canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

/* ---------- Vesti grafiche ---------- */
:root[data-skin=moog]{--bg:#3a2a1e;--fg:#2b2118;--mut:#7a6a55;--line:#c9bb9c;--acc:#d9531e;--card:#efe6d0;--zm:#d9531e18;--cab:#5b4a38;--f-src:#6e7f3a;--f-mod:#d9531e;--f-proc:#8a5a2b;--f-fx:#7b4b6a;--f-out:#4a4036}
:root[data-skin=moog]{--cap1:#76604a;--cap2:#2f2318;--rim1:#d3c19d;--rim2:#6e5a3e;--pt:#f6ecd5}
:root[data-skin=moog] body{font-family:Georgia,"Times New Roman",serif;background:repeating-linear-gradient(90deg,#3a2a1e 0 7px,#34261b 7px 8px,#3e2e21 8px 15px)}
:root[data-skin=moog] h1,:root[data-skin=moog] .tabs,:root[data-skin=moog] .bar,:root[data-skin=moog] #msg,:root[data-skin=moog] .pn-bar,:root[data-skin=moog] .k{color:#e8dcc2}
:root[data-skin=moog] .pn-card .ch b{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
:root[data-skin=moog] .pn-card{border-radius:6px;border:2px solid #bcae8f;box-shadow:inset 0 0 0 1px #fff8,0 6px 14px -6px #000a}
:root[data-skin=moog] .pn-card .kn .l{text-transform:uppercase;letter-spacing:.08em;font-size:9.5px}
:root[data-skin=moog] .kn .tr{stroke:#cbbd9f}
:root[data-skin=moog] .pn-mon,:root[data-skin=moog] .pn-keys{border-radius:6px;border:2px solid #bcae8f}
:root[data-skin=moog] select,:root[data-skin=moog] button:not(.on){background:#efe6d0;color:#2b2118;border-color:#bcae8f;border-radius:3px}
:root[data-skin=moog] .tabs{background:#2b2118;border-color:#6b5843}
:root[data-skin=moog] .tabs button.on{background:#efe6d0;color:#2b2118}
:root[data-skin=moog] .pn-bar button.on{background:#efe6d0;color:#2b2118}

:root[data-skin=prophet]{--bg:#111113;--fg:#ececec;--mut:#9a9aa2;--line:#303036;--acc:#ff3b30;--card:#1b1b1f;--zm:#ff3b3018;--cab:#a5a5ad;--f-src:#4fb37a;--f-mod:#ff7a1a;--f-proc:#4a90e2;--f-fx:#b36cf0;--f-out:#8b8b95}
:root[data-skin=prophet]{--cap1:#55555d;--cap2:#1a1a1e;--rim1:#80808a;--rim2:#08080a;--pt:#ffffff}
:root[data-skin=prophet] body{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;border-left:22px solid #5a3a22;border-right:22px solid #5a3a22;padding:16px 14px}
:root[data-skin=prophet] h1{text-transform:uppercase;letter-spacing:.3em;font-size:14px;color:var(--acc)}
:root[data-skin=prophet] .pn-card{border-radius:3px;border:1px solid #3a3a42;background:linear-gradient(180deg,#232328,#18181b)}
:root[data-skin=prophet] .pn-card::before{height:5px}
:root[data-skin=prophet] .pn-card .ch b{text-transform:uppercase;letter-spacing:.2em;font-size:10.5px}
:root[data-skin=prophet] .pn-card .kn .l{text-transform:uppercase;letter-spacing:.1em;font-size:9px}
:root[data-skin=prophet] .pn-mon,:root[data-skin=prophet] .pn-keys{border-radius:3px}
:root[data-skin=prophet] button:not(.on),:root[data-skin=prophet] select{border-radius:2px;background:#26262b}
:root[data-skin=prophet] .tabs,:root[data-skin=prophet] .tabs button{border-radius:2px}

:root[data-skin=neon]{--bg:#0a0720;--fg:#e9e6ff;--mut:#8d86c9;--line:#2c2566;--acc:#00e5ff;--card:#130e33;--zm:#00e5ff18;--cab:#7f77d9;--f-src:#2cffa0;--f-mod:#ff3df2;--f-proc:#00b7ff;--f-fx:#b57bff;--f-out:#9aa0ff}
:root[data-skin=neon]{--cap1:#383082;--cap2:#120d33;--rim1:#7a70e0;--rim2:#060316;--pt:#ffffff}
:root[data-skin=neon] body{background:radial-gradient(1200px 600px at 20% -10%,#2a1066 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#00386b 0,transparent 55%),#0a0720;background-attachment:fixed}
:root[data-skin=neon] .pn-card{border-color:color-mix(in srgb,var(--fc) 60%,#0000);box-shadow:0 0 18px -6px var(--fc),inset 0 0 22px -16px var(--fc)}
:root[data-skin=neon] .kn .va{filter:drop-shadow(0 0 6px currentColor)}
:root[data-skin=neon] .mn{text-shadow:0 0 18px var(--acc)}
:root[data-skin=neon] h1{color:var(--acc);text-shadow:0 0 14px var(--acc)}
:root[data-skin=neon] button.on,:root[data-skin=neon] .tabs button.on{color:#07041a}

:root[data-skin=grafite]{--bg:#1d1f23;--fg:#e9ecef;--mut:#8f979f;--line:#33373d;--acc:#2dd4bf;--card:#272a30;--zm:#2dd4bf18;--cab:#98a2ad;--f-src:#3ccf91;--f-mod:#f59e3b;--f-proc:#5aa7ff;--f-fx:#c08cff;--f-out:#8b95a1}
:root[data-skin=grafite]{--cap1:#646b76;--cap2:#2a2d33;--rim1:#929aa6;--rim2:#14161a;--pt:#ffffff}
:root[data-skin=grafite] .pn-card{border-radius:10px;border-color:#3a3f46;background:linear-gradient(180deg,#2d3037,#24272c)}
:root[data-skin=grafite] .pn-card::before{height:2px}
:root[data-skin=grafite] button.on,:root[data-skin=grafite] .tabs button.on{color:#06201c}

:root[data-skin=blueprint]{--bg:#0b3a6b;--fg:#e8f3ff;--mut:#8fb8e0;--line:#5b8fc4;--acc:#ffd23f;--card:#0d4478;--zm:#ffd23f18;--cab:#cfe4ff;--f-src:#8ef0c0;--f-mod:#ffd23f;--f-proc:#9cd0ff;--f-fx:#ffadd6;--f-out:#cfe4ff}
:root[data-skin=blueprint]{--cap1:#3b78b4;--cap2:#0b3a6b;--rim1:#d6e8ff;--rim2:#5b8fc4;--pt:#ffffff}
:root[data-skin=blueprint] body{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:linear-gradient(#ffffff14 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#ffffff14 1px,transparent 1px) 0 0/24px 24px,#0b3a6b}
:root[data-skin=blueprint] .pn-card,:root[data-skin=blueprint] .pn-mon,:root[data-skin=blueprint] .pn-keys{background:#0b3a6bcc;border:1.5px solid #cfe4ff;border-radius:2px;box-shadow:none}
:root[data-skin=blueprint] .pn-card .ch b{text-transform:uppercase;letter-spacing:.16em;font-size:11px}
:root[data-skin=blueprint] button:not(.on),:root[data-skin=blueprint] select{border-radius:2px;background:#0d4478}

<script>
"use strict";
const W=130, ROW=22, HEAD=26;
const PL={pitch:"nota",freq:"freq",out:"uscita",in:"ingresso",cutoffMod:"taglio",gain:"livello",in1:"1",in2:"2",in3:"3",index:"indice",ratio:"rapporto",vel:"velocity"};
const P=(k,min,max,step,unit,log)=>({k,min,max,step,unit,log});
const DEF={
  keyin:{label:"Tastiera",in:[],out:["pitch","vel"],params:[P("glide",0,0.6,0.01," s")],init:{glide:0}},
  osc:{label:"Oscillatore",in:["freq"],out:["out"],params:[{k:"wave",opts:["sawtooth","square","triangle","sine"]},P("oct",-2,2,1," ott"),P("semi",-12,12,1," st"),P("detune",-50,50,0.5," ct")],init:{wave:"sawtooth",oct:0,semi:0,detune:0}},
  fm:{label:"FM",in:["freq","index"],out:["out"],params:[P("ratio",0.25,8,0.25,"",1),P("index",0,10,0.05,"")],init:{ratio:2,index:2}},
  noise:{label:"Rumore",in:[],out:["out"],params:[],init:{}},
  hpf:{label:"Passa-alto",in:["in","cutoffMod"],out:["out"],params:[P("cutoff",100,12000,1," Hz",1),P("res",0,1,0.01,"")],init:{cutoff:1500,res:0.1}},
  syncosc:{label:"Osc sync",in:["freq","ratio"],out:["out"],params:[P("ratio",1,8,0.01,"",1)],init:{ratio:2.2}},
  mixer:{label:"Mixer",in:["in1","in2","in3"],out:["out"],params:[P("l1",0,1,0.01,""),P("l2",0,1,0.01,""),P("l3",0,1,0.01,"")],init:{l1:0.5,l2:0.5,l3:0}},
  lfo:{label:"LFO",in:[],out:["out"],params:[P("rate",0.1,20,0.1," Hz",1)],init:{rate:5}},
  ladder:{label:"Filtro",in:["in","cutoffMod"],out:["out"],params:[P("cutoff",80,8000,1," Hz",1),P("res",0,1,0.01,"")],init:{cutoff:500,res:0.25}},
  adsr:{label:"ADSR",in:[],out:["out"],params:[P("a",0.002,2,0.001," s",1),P("d",0.01,8,0.01," s",1),P("s",0,1,0.01,""),P("r",0.01,4,0.01," s",1)],init:{a:0.01,d:0.3,s:0.5,r:0.4}},
  vca:{label:"VCA",in:["in","gain"],out:["out"],params:[],init:{}},
  delay:{label:"Delay",in:["in"],out:["out"],params:[P("time",0.02,1.2,0.01," s",1),P("fb",0,0.9,0.01,""),P("mix",0,1,0.01,""),{k:"sync",opts:["libero","1/4","1/8","1/8.","1/8T","1/16","1/16."]}],init:{time:0.35,fb:0.4,mix:0.3,sync:"libero"}},
  reverb:{label:"Riverbero",in:["in"],out:["out"],params:[P("size",0.5,6,0.1," s",1),P("mix",0,1,0.01,"")],init:{size:2.5,mix:0.3}},
  modwheel:{label:"Rotella mod",in:[],out:["out"],params:[],init:{}},
  chorus:{label:"Chorus",in:["in"],out:["out"],params:[P("rate",0.1,5,0.01," Hz",1),P("depth",0,1,0.01,""),P("mix",0,1,0.01,"")],init:{rate:0.8,depth:0.5,mix:0.5}},
  output:{label:"Uscita",in:["in"],out:[],params:[P("level",0,1,0.01,"")],init:{level:0.25}}
};
const PALETTE=["osc","syncosc","fm","noise","lfo","mixer","ladder","hpf","adsr","vca","keyin","modwheel","delay","reverb","chorus","output"];
const MASTER_ONLY=["output","delay","reverb","chorus"];
const FAM={keyin:"src",osc:"src",syncosc:"src",fm:"src",noise:"src",lfo:"mod",adsr:"mod",ladder:"proc",hpf:"proc",vca:"proc",mixer:"proc",delay:"fx",reverb:"fx",chorus:"fx",modwheel:"mod",output:"out"};
const LBL={cutoff:"taglio",res:"risonanza",a:"attacco",d:"decadim.",s:"sostegno",r:"rilascio",rate:"velocità",time:"tempo",fb:"feedback",mix:"mix",size:"durata",level:"livello",ratio:"rapporto",index:"indice",detune:"accordatura",oct:"ottava",l1:"liv. 1",l2:"liv. 2",l3:"liv. 3",wave:"onda",amount:"quantità",depth:"profondità",glide:"portamento",sync:"sync",semi:"semitoni"}; // posizionati di default a destra, ma si possono spostare

/* ---------- Modello patch ---------- */
const KEY="synth-lavagna-v3"; const BW=1500, BH=620;
function defaultPatch(){ return { v:5, div:1040, name:"Patch di partenza", desc:"Due sagome leggermente scordate nel mixer, filtro e delay.", panel:"mini",
  modules:[
    {id:"kbd",type:"keyin",x:20,y:50,scope:"voice",params:{}},
    {id:"osc1",type:"osc",x:190,y:40,scope:"voice",params:{wave:"sawtooth",detune:0}},
    {id:"osc2",type:"osc",x:190,y:200,scope:"voice",params:{wave:"sawtooth",detune:7}},
    {id:"mix1",type:"mixer",x:370,y:60,scope:"voice",params:{l1:0.5,l2:0.5,l3:0}},
    {id:"flt1",type:"ladder",x:550,y:60,scope:"voice",params:{cutoff:500,res:0.25}},
    {id:"amp1",type:"vca",x:730,y:60,scope:"voice",params:{}},
    {id:"env1",type:"adsr",x:550,y:250,scope:"voice",params:{a:0.01,d:0.3,s:0.5,r:0.4}},
    {id:"dly1",type:"delay",x:1060,y:60,scope:"master",params:{time:0.35,fb:0.4,mix:0.3}},
    {id:"rev1",type:"reverb",x:1200,y:60,scope:"master",params:{size:2.5,mix:0.3}},
    {id:"out",type:"output",x:1340,y:60,scope:"master",params:{level:0.25}}
  ],
  cables:[
    {from:"kbd.pitch",to:"osc1.freq"},{from:"kbd.pitch",to:"osc2.freq"},
    {from:"osc1.out",to:"mix1.in1"},{from:"osc2.out",to:"mix1.in2"},{from:"mix1.out",to:"flt1.in"},
    {from:"env1.out",to:"flt1.cutoffMod",amount:3500},{from:"flt1.out",to:"amp1.in"},
    {from:"env1.out",to:"amp1.gain"},{from:"amp1.out",to:"dly1.in"},
    {from:"dly1.out",to:"rev1.in"},{from:"rev1.out",to:"out.in"}
  ]}; }
let patch; try{ patch=JSON.parse(localStorage.getItem(KEY)); if(!patch||!patch.modules) throw 0; }catch(e){ patch=defaultPatch(); }
if(!patch.v){ patch.v=5; patch.div+=100; patch.modules.forEach(m=>{ if(m.scope==="master") m.x+=100; }); }
let loading=false;
const save=()=>{ if(!loading) patch.mod=true; try{ localStorage.setItem(KEY,JSON.stringify(patch)); }catch(e){} if(typeof updateMon==="function") updateMon(); };
const mod=id=>patch.modules.find(m=>m.id===id);
const scopeOf=m=>(m.x+W/2>patch.div)?"master":"voice";
function valid(){
  for(const m of patch.modules){ if(m.type==="output"&&m.scope!=="master") return false; if(m.type==="keyin"&&m.scope!=="voice") return false; }
  return patch.cables.every(c=>!(mod(c.from.split(".")[0]).scope==="master"&&mod(c.to.split(".")[0]).scope==="voice"));
}
function reaches(a,b,seen={}){ if(a===b) return true; if(seen[a]) return false; seen[a]=1;
  return patch.cables.some(c=>c.from.split(".")[0]===a&&reaches(c.to.split(".")[0],b,seen)); }

/* ---------- Motore audio (come il passo 1, ma guidato dalla lavagna) ---------- */
const SYNCB={"1/4":1,"1/8":0.5,"1/8.":0.75,"1/8T":1/3,"1/16":0.25,"1/16.":0.375};
function delayTime(p){ const b=SYNCB[p.sync]; if(!b) return p.time; const bpm=(patch.arp&&patch.arp.bpm)||120; return Math.min(1.99,Math.max(0.02,60/bpm*b)); }
function refreshDelays(){ patch.modules.forEach(m=>{ if(m.type==="delay") [master,...voices].forEach(v=>{ const i=v&&v.inst[m.id]; if(i&&i.update) i.update(m.params); }); }); }
const hold=(p,t)=>{ if(p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else { p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); } };
const TYPES={
  keyin(ctx,p){ const c=ctx.createConstantSource(); c.offset.value=261.63; c.start(); const w=ctx.createConstantSource(); w.offset.value=0.8; w.start();
    return {ports:{pitch:c,vel:w},pitch:c.offset,glide:()=>p.glide||0,setVel(x,t){ w.offset.setTargetAtTime(x,t,0.004); },stop(){c.stop();c.disconnect();w.stop();w.disconnect();}}; },
  modwheel(ctx){ const c=ctx.createConstantSource(); c.offset.value=modVal; c.start();
    return {ports:{out:c},setMod(v){ c.offset.setTargetAtTime(v,ctx.currentTime,0.02); },stop(){c.stop();c.disconnect();}}; },
  osc(ctx,p){ const o=ctx.createOscillator(); o.type=p.wave; o.detune.value=(p.oct||0)*1200+(p.semi||0)*100+(p.detune||0); o.frequency.value=0; o.start();
    return {ports:{out:o,freq:o.frequency},update(p){o.type=p.wave;o.detune.value=(p.oct||0)*1200+(p.semi||0)*100+(p.detune||0);},stop(){o.stop();o.disconnect();}}; },
  fm(ctx,p){ const f=ctx.createConstantSource(); f.offset.value=0;

      const o=d.dir==="out"?{id:d.id,name:d.name}:{id,name}, i=d.dir==="out"?{id,name}:{id:d.id,name:d.name};
      const c={from:o.id+"."+o.name,to:i.id+"."+i.name};
      if(patch.cables.some(x=>x.from===c.from&&x.to===c.to)) msg("Questo cavo esiste già.");
      else if(mod(o.id).scope==="master"&&mod(i.id).scope==="voice") msg("Dal master non si torna alle voci.");
      else if(reaches(i.id,o.id)) msg("Cavo rifiutato: crea un anello di retroazione, non ancora supportato.");
      else{ if(i.name==="cutoffMod") c.amount=2000; else if(i.name==="freq"&&mod(o.id).type!=="keyin") c.amount=10; else if(i.name==="index") c.amount=3; else if(i.name==="ratio") c.amount=2;
        patch.cables.push(c); selCab=c; sel=null; commit(); return; } } }
    render(); return;
  }
  const before=patch.modules.map(m=>m.scope+m.id);
  patch.modules.forEach(m=>m.scope=scopeOf(m));
  if(!valid()){ if(d.type==="mod"){ d.m.x=d.x0; d.m.y=d.y0; } else patch.div=d.d0;
    patch.modules.forEach(m=>m.scope=scopeOf(m)); msg("Posizione non valida: Tastiera sta a sinistra, Uscita a destra, e il master non torna alle voci."); render(); return; }
  if(before.join()!==patch.modules.map(m=>m.scope+m.id).join()) commit(); else { save(); render(); }
});

/* ---------- Pannello di modifica con manopole ---------- */
function knob(host,label,obj,k,min,max,step,unit,log,live,fam){
  const dec=(String(step).split(".")[1]||"").length, lo=v=>Math.max(v===undefined?min:v,min);
  const toT=v=>log?Math.log(lo(v)/min)/Math.log(max/min):(lo(v)-min)/(max-min);
  const fromT=t=>{ t=Math.max(0,Math.min(1,t)); let v=log?min*Math.pow(max/min,t):min+t*(max-min); v=Math.round(v/step)*step; return Math.max(min,Math.min(max,v)); };
  const pt=(deg,r)=>[28+r*Math.sin(deg*Math.PI/180),28-r*Math.cos(deg*Math.PI/180)];
  const arc=(a0,a1,r)=>{ const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r); return `M${x0},${y0} A${r},${r} 0 ${a1-a0>180?1:0} 1 ${x1},${y1}`; };
  const d=document.createElement("div"); d.className="kn";
  d.innerHTML=`<div class="l">${label}</div><svg width="56" height="56" viewBox="0 0 56 56"><path class="tr" d="${arc(-135,135,22)}"/><path class="va" style="stroke:var(--f-${fam});color:var(--f-${fam})"/><circle class="ks" cx="28" cy="31" r="18"/><circle class="kr" cx="28" cy="28" r="18"/><circle class="kc" cx="28" cy="28" r="15.6"/><circle class="kd" cx="28" cy="28" r="10.5"/><line class="pn" x1="28" y1="22" x2="28" y2="13"/></svg><div class="v"></div>`;
  const svg=d.querySelector("svg"), va=d.querySelector(".va"), pn=d.querySelector(".pn"), vt=d.querySelector(".v");
  const show=()=>{ const t=toT(obj[k]), ang=-135+270*t; va.setAttribute("d",t>0.003?arc(-135,ang,22):"");
    const [x,y]=pt(ang,13.5), [x0,y0]=pt(ang,6); pn.setAttribute("x2",x); pn.setAttribute("y2",y); pn.setAttribute("x1",x0); pn.setAttribute("y1",y0); vt.textContent=lo(obj[k]).toFixed(dec)+unit; };
  let t0,y0;
  svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); y0=e.clientY; t0=toT(obj[k]); e.preventDefault(); });
  svg.addEventListener("pointermove",e=>{ if(!svg.hasPointerCapture(e.pointerId)) return; obj[k]=fromT(t0+(y0-e.clientY)/(e.shiftKey?700:160)); show(); live(); });
  svg.addEventListener("pointerup",()=>save());
  svg.addEventListener("wheel",e=>{ e.preventDefault(); obj[k]=fromT(toT(obj[k])-e.deltaY/1500); show(); live(); save(); },{passive:false});
  show(); host.appendChild(d);
}
function inspector(){
  const el=document.getElementById("insp"); el.innerHTML="";
  const btn=(txt,fn)=>{ const b=document.createElement("button"); b.textContent=txt; b.style.marginTop="10px"; b.onclick=fn; el.appendChild(b); };
  if(sel){ const d=DEF[sel.type], fam=FAM[sel.type], id=sel.id, pr=sel.params;
    const live=()=>[master,...voices].forEach(v=>v&&v.inst[id]&&v.inst[id].update&&v.inst[id].update(pr));
    el.insertAdjacentHTML("beforeend",`<b style="color:var(--f-${fam})">${d.label}</b> <span style="color:var(--mut)">(${id}, ${sel.scope==="master"?"master":"per voce"})</span>`);
    const w=document.createElement("div"); w.className="kns"; el.appendChild(w);
    d.params.forEach(p=>{
      if(p.opts){ const r=document.createElement("div"); r.className="kn"; r.innerHTML=`<div class="l">${LBL[p.k]}</div><select style="margin:14px 0">${p.opts.map(o=>`<option${o===pr[p.k]?" selected":""}>${o}</option>`).join("")}</select>`;
        r.querySelector("select").onchange=e=>{ pr[p.k]=e.target.value; live(); save(); e.target.blur(); }; w.appendChild(r); }
      else knob(w,LBL[p.k]||p.k,pr,p.k,p.min,p.max,p.step,p.unit,p.log,live,fam);
    });
    if(!d.params.length) w.innerHTML=`<span style="color:var(--mut)">Nessun parametro.</span>`;
    btn("Elimina modulo",()=>{ patch.modules=patch.modules.filter(m=>m!==sel); patch.cables=patch.cables.filter(c=>c.from.split(".")[0]!==id&&c.to.split(".")[0]!==id); sel=null; commit(); });
  } else if(selCab){ const fam=FAM[mod(selCab.from.split(".")[0]).type], c=selCab;
    el.insertAdjacentHTML("beforeend",`<b>Cavo</b> <span style="color:var(--mut)">${c.from} → ${c.to} · doppio clic per eliminarlo</span>`);
    if(c.amount!==undefined){ const tpn=c.to.split(".")[1], R=amtR(tpn,mod(c.from.split(".")[0]).type), w=document.createElement("div"); w.className="kns"; el.appendChild(w);
      knob(w,LBL.amount,c,"amount",R[0],R[1],R[2],R[3],false,()=>voices.forEach(v=>{ const g=v.gains.get(c); if(g) g.gain.value=c.amount; }),fam); }
    btn("Elimina cavo",()=>{ patch.cables=patch.cables.filter(x=>x!==c); selCab=null; commit(); });
  } else el.innerHTML=`<span style="color:var(--mut)">Seleziona un modulo o un cavo per modificarlo. Manopole: trascina in verticale (Maiusc per il fine), oppure usa la rotella.</span>`;
}

/* ---------- Preset ---------- */
function mk(mods,cabs){
  return { v:5, div:1040,
    modules:mods.map(([id,type,c,r,params])=>({id,type,x:c>=100?1060+(c-100)*140:20+c*170,y:40+r*160,scope:c>=100?"master":"voice",params:Object.assign({},DEF[type].init,params||{})})),
    cables:cabs.map(t=>{ const [f,rest]=t.split(">"), [to,amt]=rest.split(":"); const c={from:f,to}; if(amt!==undefined) c.amount=+amt; return c; }) };
}

const FMT="modular-synth";

  if(o.modules.length>80||o.cables.length>300) bad("Patch troppo grande.");

    if(!m||typeof m!=="object"||!has(DEF,m.type)) bad("Modulo sconosciuto"+(m&&m.type?": "+String(m.type).slice(0,20):"")+".");
    if(typeof m.id!=="string"||!/^[A-Za-z][A-Za-z0-9_-]{0,23}$/.test(m.id)||ids.has(m.id)) bad("Identificatore di modulo non valido o ripetuto.");

      if(p.opts){ if(p.opts.includes(v)) params[p.k]=v; }
      else if(typeof v==="number"&&Number.isFinite(v)){ const sp=p.max-p.min, lo=p.min>=0?Math.max(0,p.min-sp):p.min-sp; params[p.k]=clampN(v,lo,p.max+sp); } });
    const y=clampN(Number.isFinite(+m.y)?+m.y:40,28,BH-hgt({type:m.type})-6);

  }

let starting=false;
document.getElementById("go").onclick=async e=>{ if(ctx||starting) return; starting=true; const btn=e.currentTarget||e.target; btn.textContent="Avvio…";
  try{
    ctx=new AudioContext({latencyHint:"interactive"}); try{ ctx.resume(); }catch(_){}
    ctx.an=ctx.createAnalyser(); ctx.an.fftSize=2048; ctx.an.smoothingTimeConstant=0.8;
    try{ await Promise.race([ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET_SRC],{type:"text/javascript"}))), new Promise((_,no)=>setTimeout(()=>no(new Error("tempo scaduto")),4000))]); ctx.hasLadder=true; }
    catch(err){ ctx.hasLadder=false; msg("Filtro a scala non disponibile ("+(err&&err.message||err)+"): uso il filtro semplice."); }
    rebuildAll(); arpSync(); initMidi(); btn.classList.add("on"); btn.textContent="Audio attivo";
  }catch(err){ try{ ctx&&ctx.close(); }catch(_){} ctx=null; btn.classList.remove("on"); btn.textContent="Avvia audio"; msg("Impossibile avviare l'audio: "+(err&&err.message||err)); }
  starting=false; };
addEventListener("error",ev=>{ try{ msg("Errore: "+ev.message); }catch(_){} });
addEventListener("unhandledrejection",ev=>{ try{ msg("Errore: "+(ev.reason&&ev.reason.message||ev.reason)); }catch(_){} });
/* niente selezione di testo, lente o menu contestuale quando si tocca la tastiera, le rotelle o le manopole */
document.addEventListener("selectstart",e=>{ const el=e.target.nodeType===1?e.target:e.target.parentElement; if(el&&el.closest&&el.closest("#panelView,#boardView")&&!el.closest("select,input,textarea")) e.preventDefault(); });
document.addEventListener("contextmenu",e=>{ if(e.target.closest&&e.target.closest(".key,.wheel,.kn svg,.spl,#mon canvas")) e.preventDefault(); });
render(); buildKeys();
WH.pitch=wheel("wPitch",v=>setBendN((v-0.5)*2,true),true,0.5);
WH.mod=wheel("wMod",v=>setMod(v,true),false,modVal);
showView("panel"); requestAnimationFrame(frame);

/* ---------- Vesti grafiche ---------- */
(()=>{ const sel=document.getElementById("skin"), K="synth-skin"; let v=""; try{ v=localStorage.getItem(K)||""; }catch(e){}
  const set=x=>{ if(x) document.documentElement.dataset.skin=x; else delete document.documentElement.dataset.skin; sel.value=x||""; if(sel.value!==(x||"")){ sel.value=""; delete document.documentElement.dataset.skin; } };
  set(v); sel.onchange=()=>{ set(sel.value); try{ localStorage.setItem(K,sel.value); }catch(e){} sel.blur(); }; })();
</script>
<script>
/* Funzionamento senza rete: il service worker conserva i file dell'app */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
